services:
  postgresql:
    container_name: postgresql
    image: docker.io/library/postgres:17.9
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER:-pgadmin}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASS:?admin password required}
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -U ${PG_ADMIN_USER:-pgadmin}
      timeout: 5s
    networks:
      - internal
