services:
  postgresql:
    container_name: postgresql
    image: docker.io/library/postgres:17.9
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER:?admin user required}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASS:?admin password required}
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./config/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    ports:
      - "5432:5432"
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -U ${PG_ADMIN_USER:?admin user required} -d ${PG_DB:?database name required}
      timeout: 5s
    networks:
      - internal

  pgbouncer:
    container_name: pgbouncer
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env
    environment:
      # tell edoburu entrypoint not to touch config — DB_HOST must be set to something
      # but since pgbouncer.ini already exists, it won't override it
      DB_HOST: postgresql
      DB_USER: ${PG_ADMIN_USER:?admin user required}
      DB_PASSWORD: ${PG_ADMIN_PASS:?admin password required}
      DB_NAME: ${PG_DB_APP:?app database name required}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/pgbouncer_hba.conf:/etc/pgbouncer/pgbouncer_hba.conf:ro
      - ./pgbouncer/pg_ident.conf:/etc/pgbouncer/pg_ident.conf:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - ./tls/ca.crt:/etc/pgbouncer-certs/ca.crt:ro
      - ./tls/pgbouncer-server.crt:/etc/pgbouncer-certs/pgbouncer-server.crt:ro
      - ./tls/pgbouncer-server.key:/etc/pgbouncer-certs/pgbouncer-server.key:ro
    ports:
      - "6432:6432"
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 10s
      test:
        - CMD-SHELL
        - psql "host=/tmp port=6432 dbname=pgbouncer user=${PGB_ADMIN_USER:?pgbouncer admin user required} password=${PGB_ADMIN_PASS:?pgbouncer admin password required}" -c "SHOW VERSION;" || exit 1
      timeout: 5s
    networks:
      - internal
