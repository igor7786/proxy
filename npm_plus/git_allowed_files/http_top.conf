geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    auto_reload 60m;
    $geoip2_country_iso_code default=ZZ country iso_code;
}

map $geoip2_country_iso_code $geoip2_country_rule {
    default yes;   # allow all by default
    CN      no;    # China
    KP      no;    # North Korea
    UA      no;    # Ukraine
    IR      no;    # Iran
}

geo $lan_ip {
    default         no;
    192.168.0.0/16  yes;
    172.16.0.0/12   yes;
    10.0.0.0/8      yes;
    127.0.0.0/8     yes;
}
