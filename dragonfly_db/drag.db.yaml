services:
  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:latest
    container_name: dragonfly
    restart: unless-stopped
    ulimits:
      memlock: -1
    security_opt:
      - no-new-privileges:true
    depends_on:
      - npmplus
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:9091:9091"
    volumes:
      - ./dragonfly_data:/data
    env_file:
      - ../.env
    command: >
      --cache_mode=true
      --maxmemory=${DRAGONFLY_MAXMEM}
      --dir=/data
      --dbfilename=dump
      --port=6379
      --snapshot_cron="0 * * * *"
      --aclfile=/data/acl.conf
      --proactor_threads=2
      --force_epoll=false
      --admin_port=9091
    # The ACL-compatible health check configuration
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "--no-auth-warning",
             "--user", "healthchecker", "-a", "${Health_Check}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - internal
