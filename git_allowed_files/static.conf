
# ─────────────────────────────────────────────
# COMPRESSION
# ─────────────────────────────────────────────

gzip_comp_level 6;
gzip_min_length 1000;


brotli_comp_level 6;
brotli_min_length 1000;


# ─────────────────────────────────────────────
# ZSTD COMPRESSION (SAFE ENABLED)
# ─────────────────────────────────────────────

zstd_comp_level 3;
zstd_min_length 1000;

# ─── Static Assets ─────────────────────────────────────────
location ~* ^/(_astro|fonts)/ {
    root /var/www/astro-static;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# ─── Sitemaps ──────────────────────────────────────────────
location ~* ^/sitemap.*\.xml$ {
    root /var/www/astro-static;
    expires 1d;
    add_header Cache-Control "public";
    try_files $uri =404;
}

# ─── Static HTML ───────────────────────────────────────────
location = / {
    root /var/www/astro-static;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    try_files /index.html @bun;
}

location ^~ /playground/ {
    root /var/www/astro-static;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri $uri/ $uri/index.html @bun;
}

# ─── Fallback to Bun SSR ───────────────────────────────────
location @bun {
    proxy_pass http://astro-app:4321;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
