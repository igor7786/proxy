# Allow LAN traffic regardless of geo
if ($lan_ip = yes) {
    set $geoip2_country_rule yes;
}

# Allow ACME/Let's Encrypt certificate challenges through
if ($request_uri ~* "^/\.well-known/acme-challenge/") {
    set $geoip2_country_rule yes;
}

# Drop any request not in the whitelist
if ($geoip2_country_rule = no) {
    return 403;
}

# Forward geo data to upstream for requests that passed the check above
proxy_set_header X-Request-Id           $request_id;
proxy_set_header X-Real-IP              $remote_addr;
proxy_set_header X-GeoIP-Country-Code   $geoip2_country_iso_code;
proxy_set_header X-GeoIP-Country-Name   $geoip2_country_name;
proxy_set_header X-GeoIP-Continent      $geoip2_continent_name;
proxy_set_header X-GeoIP-City           $geoip2_city_name;
proxy_set_header X-GeoIP-Postal-Code    $geoip2_postal_code;
proxy_set_header X-GeoIP-Region-Code    $geoip2_region_code;
proxy_set_header X-GeoIP-Region-Name    $geoip2_region_name;
proxy_set_header X-GeoIP-Latitude       $geoip2_latitude;
proxy_set_header X-GeoIP-Longitude      $geoip2_longitude;
proxy_set_header X-GeoIP-Timezone       $geoip2_timezone;
proxy_set_header X-GeoIP-Metro-Code     $geoip2_metro_code;
