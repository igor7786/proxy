geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    auto_reload 60m;
    $geoip2_country_iso_code default=ZZ country iso_code;
    $geoip2_country_name     default=Unknown country names en;
}

map $geoip2_country_iso_code $geoip2_country_rule {
    default yes;
    CN      no;
    KP      no;
    UA      no;
    IR      no;
}

geo $lan_ip {
    default         no;
    192.168.0.0/16  yes;
    172.16.0.0/12   yes;
    10.0.0.0/8      yes;
    127.0.0.0/8     yes;
}

geoip2 /usr/share/GeoIP/GeoLite2-City.mmdb {
    auto_reload 60m;
    $geoip2_city_name      city names en;
    $geoip2_continent_name continent names en;
    $geoip2_postal_code    postal code;
    $geoip2_region_code    subdivisions 0 iso_code;
    $geoip2_region_name    subdivisions 0 names en;
    $geoip2_latitude       location latitude;
    $geoip2_longitude      location longitude;
    $geoip2_timezone       location time_zone;
    $geoip2_metro_code     location metro_code;
}
