services:
  astro:
    # container_name: astro-app  ← remove this, replicas can't share a name
    image: astro-app:latest
    build:
      context: ../../project
      dockerfile: ../docker/astro/Dockerfile
    restart: unless-stopped
    depends_on:
      - dragonfly
      - npmplus
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../../project/.env
    expose:
      - "4321"
    networks:
      internal:
        aliases:
          - astro-app
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
