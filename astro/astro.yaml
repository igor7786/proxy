services:
  astro:
    # container_name: astro-app  ← remove this, replicas can't share a name
    image: astro-app:latest
    build:
      context: ../../project
      dockerfile: ../docker/astro/Dockerfile
    restart: unless-stopped
    depends_on:
      dragonfly:
        condition: service_healthy
      # - npmplus
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../../project/.env
    volumes:
      - ../../../ca/certs/ca.crt:/app/.certs/ca.crt:ro
      - ../../../ca/certs/homepc.crt:/app/.certs/homepc.crt:ro
      - ../../../ca/certs/homepc.key:/app/.certs/homepc.key:ro
    expose:
      - "4321"
    networks:
      internal:
        aliases:
          - astro-app
      redpanda_network:
        aliases:
          - astro-app
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('net').connect(4321,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
